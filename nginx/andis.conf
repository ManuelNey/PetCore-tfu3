events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------
    # Gateway Offloading: este nginx hace por la API tareas que no son de
    # negocio, para que la API no tenga que implementarlas:
    #   1. Termina TLS (HTTPS). Hacia la API el tráfico sigue siendo HTTP.
    #   2. Agrega cabeceras de seguridad y oculta qué tecnología hay detrás.
    #   3. Limita los pedidos de login por dirección IP (responde 429 sin
    #      molestar a la API).
    # ------------------------------------------------------------------

    # No publicar la versión de nginx en la cabecera Server.
    server_tokens off;

    # Límite de pedidos de login por IP. Solo se cuenta POST /auth/login:
    # para cualquier otra ruta la clave queda vacía y nginx no cuenta nada.
    # 30 por minuto, con una ráfaga de hasta 20 (ver "burst" más abajo).
    map "$request_method $request_uri" $clave_login {
        default              "";
        "~^POST /auth/login" $binary_remote_addr;
    }
    limit_req_zone $clave_login zone=login_por_ip:10m rate=30r/m;
    limit_req_status 429;

    upstream api_backend {
        server server:8000 max_fails=1 fail_timeout=5s;
    }

    server {
        # HTTP: se mantiene para el frontend, los scripts y las colecciones.
        listen 8080;

        # HTTPS: el gateway termina TLS con el certificado de la imagen.
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=login_por_ip burst=20 nodelay;

            proxy_pass http://api_backend;

            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;

            # http_503 a proposito no esta en esta lista: /health devuelve 503 cuando
            # esa replica no puede hablar con Postgres, y como las dos replicas
            # comparten la misma base, reintentar contra la otra no sirve de nada y
            # solo duplica la espera (pudiendo superar proxy_read_timeout y devolver
            # 504 en vez de un 503 limpio).
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # La API (uvicorn) no tiene por qué mostrarse hacia afuera.
            proxy_hide_header Server;

            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;

            # Cabeceras de seguridad: las agrega el gateway, no la API.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # Respuesta cuando se supera el límite de login. La genera nginx:
        # el pedido nunca llega a la API.
        error_page 429 = @demasiados_pedidos;

        location @demasiados_pedidos {
            default_type application/json;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;

            return 429 '{"detail":"Demasiados intentos de inicio de sesion desde esta direccion. Espera un minuto antes de reintentar."}';
        }
    }
}