services:

  # Servicio del frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
    ports:
      - 5173:5173

    # Monta el código para que los cambios se vean sin reconstruir la imagen
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Servicio de FastAPI
  server:
    build:
      context: .
    expose:
      - "8000"
    
    # Datos para que FastAPI encuentre PostgreSQL
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: petcore_app
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CACHE_TTL_SECONDS: 300

      JWT_SECRET_KEY_FILE: /run/secrets/jwt-secret
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      LOGIN_MAX_INTENTOS: 5
      LOGIN_BLOQUEO_MINUTOS: 15

      # Exportación del historial a PDF. La pausa es solo para la demo: permite
      # ver el estado PENDIENTE. Poner 0 para generar sin demora.
      EXPORTACIONES_DIR: /app/exportaciones
      EXPORTACION_RETARDO_SEGUNDOS: 5

      # Valet Key: validez del enlace de descarga. 10 minutos por defecto; para
      # demostrar el vencimiento, definir VALET_KEY_SEGUNDOS=10 antes de levantar.
      VALET_KEY_SEGUNDOS: ${VALET_KEY_SEGUNDOS:-600}

    # Carpeta donde se guardan los PDF. Se comparte entre las dos copias de la API
    # para que cualquiera pueda entregar un PDF que generó la otra.
    volumes:
      - exportaciones:/app/exportaciones

    # Esperar a que PostgreSQL este saludable antes de iniciar FastAPI
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # Deja a FastAPI leer la contraseña
    secrets:
      - db-password
      - jwt-secret

  # Balancea las solicitudes entre las réplicas de FastAPI
  balanceador:
    build:
      context: ./nginx          # antes: image: nginx:alpine
    ports:
      - "8000:8080"             # HTTP (igual que antes)
      - "8443:8443"             # HTTPS: el gateway termina TLS
    volumes:
      - ./nginx/andis.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

  # Redis Cache
  redis:
    image: redis:7-alpine

    restart: always

    # Redis solamente es accesible dentro de la red de Docker
    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

      
  # Servicio de PostgreSQL
  db:
    image: postgres:18
    container_name: postgres-dev

    # Reinicia PostgreSQL automáticamente si el contenedor se detiene
    restart: always
    user: postgres

    # Permite a PostgreSQL leer la contraseña
    secrets:
      - db-password

    # Config inicial de PostgreSQL
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

    # Comprueba cada 10 segundos si PostgreSQL acepta conexiones
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

# Crea un volumen para guardar los datos de PostgreSQL
# Los datos permanecen aunque se elimine el contenedor, mientras no se elimine el volumen
volumes:
  postgres_data:
  exportaciones:

# Acá se declara el archivo de contraseña como un secreto de Docker Compose
secrets:
  db-password:
    file: db/password.txt

  jwt-secret:
    file: db/jwt-secret.txt
